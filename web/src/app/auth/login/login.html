<section>
    <form #LoginForm="ngForm" (ngSubmit)="onSubmit(LoginForm)">
        <!-- Email or username -->
        <mat-form-field hintLabel="The email or username you signed up with">
            <input matInput type="text" placeholder="Email or username *" ngModel name="username" required
                autocomplete="username" />
        </mat-form-field>
        <!-- Password -->
        <mat-form-field>
            <input matInput type="password" placeholder="Your password *" ngModel name="password" required
                autocomplete="current-password" />
        </mat-form-field>
        @if (error()) {
        <p class="error" role="alert">{{ error() }}</p>
        }
        <button type="submit" mat-raised-button color="primary" [disabled]="LoginForm.invalid || isLoading()">
            @if (isLoading()) {
            <mat-spinner diameter="20"></mat-spinner>
            } @else {
            <span>Submit</span>
            }
        </button>
    </form>
</section>
