<section class="new-training-container">
    <form #fExersice="ngForm" (ngSubmit)="onStartTraining(fExersice)">
        <mat-card class="new-training-card">
            <mat-card-header>
                <mat-card-title> Start a new workout!</mat-card-title>
            </mat-card-header>
            <mat-card-content>
                <mat-form-field>
                    <mat-label>Pick excercise</mat-label>
                    <mat-select ngModel name="exercise" required>
                        @for (exercise of exercises; track exercise.id ) {
                        <mat-option [value]="exercise.id">{{exercise.name}}</mat-option>
                        }
                    </mat-select>
                </mat-form-field>
            </mat-card-content>
            <mat-card-actions>
                <button type="submit" matButton [disabled]="fExersice.invalid">Start</button>
            </mat-card-actions>
        </mat-card>
    </form>
</section>
