<section class="new-workout">
    <a matButton="filled" class="new-workout-action" routerLink="/current-workout" [queryParams]="{ mode: 'start-workout' }">
        <mat-icon>play_arrow</mat-icon>
        {{ inProgress() ? 'Resume workout' : 'Start workout' }}
    </a>
    <a matButton="outlined" class="new-workout-action" routerLink="/current-workout" [queryParams]="{ mode: 'plan-workout' }">
        <mat-icon>add</mat-icon>
        Plan a workout
    </a>
</section>
