<section class="current-workout-container">
    <div class="cw-header">
        <div class="cw-controls">
            <button mat-fab class="cw-clear-btn" aria-label="Clear the workout" (click)="clearWorkout()">
                <mat-icon>clear</mat-icon>
            </button>

            <div class="cw-controls-right">
                <button mat-fab class="cw-done-btn" aria-label="Finish the workout">
                    <mat-icon>check</mat-icon>
                </button>
            </div>
        </div>
        <div class="exercise-btn">
            <button mat-raised-button class="cw-add-ex" (click)="openExercisesPopup()">
                <mat-icon>add</mat-icon>
                <span>Exercise</span>
            </button>
        </div>
    </div>
    @for (card of exerciseCards(); track card.key) {
    <app-exercise-card [exercise]="card.exercise" (remove)="deleteCard(card.key)"></app-exercise-card>
    }
    <app-timer></app-timer>
</section>
