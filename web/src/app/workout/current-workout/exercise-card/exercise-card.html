<mat-card class="exercise-card">
    <mat-card-header>
        <mat-card-title class="exercise-title" role="button" tabindex="0" (click)="showInfo()" (keydown.enter)="showInfo()">
            {{ exercise().name }}
        </mat-card-title>

        <button mat-icon-button [attr.aria-label]="exercise().name + ' options'" [matMenuTriggerFor]="cardMenu">
            <mat-icon>more_vert</mat-icon>
        </button>
        <mat-menu #cardMenu="matMenu">
            <button mat-menu-item (click)="clearCard()">
                <mat-icon>clear</mat-icon>
                Clear
            </button>
            <button mat-menu-item (click)="deleteCard()">
                <mat-icon>delete</mat-icon>
                Delete
            </button>
        </mat-menu>
    </mat-card-header>

    <mat-card-content>

        <!-- TABLE -->
        <div class="exercise-table-clip">
        <table mat-table [dataSource]="rows()" class="exercise-table">

            <!-- Counter / icon -->
            <ng-container matColumnDef="counter">
                <td mat-cell *matCellDef="let row; let i = index">
                    @if (row.warmup) {
                    <mat-icon class="warmup-icon" aria-label="Warm-up">local_fire_department</mat-icon>
                    }
                    @else {
                    {{ getSetNumber(i) }}
                    }
                </td>
            </ng-container>

            <!-- Weight -->
            <ng-container matColumnDef="weight">
                <td mat-cell *matCellDef="let row">
                    @if (!isEditing(row, 'weight')) {
                    <div class="editable" role="button" tabindex="0" (click)="edit(row, 'weight')" (keydown.enter)="edit(row, 'weight')">
                        {{ row.weight }} <span class="unit">kg</span>
                    </div>
                    } @else {
                    <input type="number" inputmode="numeric" pattern="[0-9]*" class="edit-input"
                        [(ngModel)]="row.weight" (blur)="stopEdit()"
                        (keydown.enter)="stopEdit()" />
                    }
                </td>
            </ng-container>

            <!-- Reps -->
            <ng-container matColumnDef="reps">
                <td mat-cell *matCellDef="let row">
                    @if (!isEditing(row, 'reps')) {
                    <div class="editable" role="button" tabindex="0" (click)="edit(row, 'reps')" (keydown.enter)="edit(row, 'reps')">
                        {{ row.reps }} <span class="unit">reps</span>
                    </div>
                    } @else {
                    <input type="number" inputmode="numeric" pattern="[0-9]*" class="edit-input"
                        [(ngModel)]="row.reps" (blur)="stopEdit()"
                        (keydown.enter)="stopEdit()" />
                    }
                </td>
            </ng-container>

            <!-- Actions -->
            <ng-container matColumnDef="actions">
                <td mat-cell *matCellDef="let row; let i = index">
                    <div class="row-actions">
                        <button mat-icon-button class="row-move" aria-label="Move up" [disabled]="!canMove(i, -1)" (click)="moveRow(i, -1)">
                            <mat-icon>keyboard_arrow_up</mat-icon>
                        </button>
                        <button mat-icon-button class="row-move" aria-label="Move down" [disabled]="!canMove(i, 1)" (click)="moveRow(i, 1)">
                            <mat-icon>keyboard_arrow_down</mat-icon>
                        </button>
                        <button mat-icon-button class="row-move" aria-label="Set options" [matMenuTriggerFor]="rowMenu" (click)="currentRow.set(row)">
                            <mat-icon>more_vert</mat-icon>
                        </button>
                    </div>
                    <div class="row-swipe-delete" aria-hidden="true">
                        <mat-icon>delete</mat-icon>
                    </div>
                </td>
            </ng-container>

            <mat-menu #rowMenu="matMenu">
                <button mat-menu-item (click)="deleteRow(currentRow())">
                    <mat-icon>delete</mat-icon>
                    Delete
                </button>
            </mat-menu>

            <tr mat-row *matRowDef="let row; columns: displayedColumns" [class.warmup-row]="row.warmup" appSwipeActions #swipe="appSwipeActions"
                (swipedLeft)="deleteRow(row, swipe)"></tr>
        </table>
        </div>

        <!-- Add a warm-up or a set -->
        <div class="card-add">
            <button matButton="tonal" (click)="addWarmup()">
                <mat-icon>add</mat-icon>
                Warm-up
            </button>
            <button matButton="tonal" (click)="addSet()">
                <mat-icon>add</mat-icon>
                Set
            </button>
        </div>

    </mat-card-content>
</mat-card>
