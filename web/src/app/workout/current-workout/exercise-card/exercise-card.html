<mat-card class="exercise-card">
    <mat-card-header>
        <mat-card-title>
            {{ exercise().name }}
        </mat-card-title>

        <button mat-icon-button [matMenuTriggerFor]="cardMenu">
            <mat-icon>more_vert</mat-icon>
        </button>
        <mat-menu #cardMenu="matMenu">
            <button mat-menu-item (click)="clearCard()">
                <mat-icon>clear</mat-icon>
                Clear
            </button>
            <button mat-menu-item (click)="deleteCard()">
                <mat-icon>delete</mat-icon>
                Delete
            </button>
        </mat-menu>
    </mat-card-header>

    <mat-card-content>

        <!-- Add warm-up -->
        <div class="center-row">
            <button mat-raised-button color="primary" (click)="addWarmup()">
                <mat-icon>add</mat-icon>
                Warm-up
            </button>
        </div>

        <!-- TABLE -->
        <table mat-table [dataSource]="rows()" class="exercise-table" cdkDropList
            (cdkDropListDropped)="dropRow($event)">

            <!-- Counter / icon -->
            <ng-container matColumnDef="counter">
                <td mat-cell *matCellDef="let row; let i = index" cdkDragHandle>
                    <div class="swipe-container">
                        @if (row.warmup) {
                        <ng-container>
                            <mat-icon color="accent">local_fire_department</mat-icon>
                        </ng-container>
                        }
                        @else {
                        <ng-container>{{ getSetNumber(i) }}</ng-container>
                        }
                    </div>
                </td>
            </ng-container>

            <!-- Weight -->
            <ng-container matColumnDef="weight">
                <td mat-cell *matCellDef="let row" cdkDragHandle>
                    <div class="swipe-container">
                        @if (!isEditing(row, 'weight')) {
                        <div class="editable" role="button" tabindex="0" (click)="edit(row, 'weight')" (keydown.enter)="edit(row, 'weight')">
                            {{ row.weight }} kg
                        </div>
                        } @else {
                        <input type="number" inputmode="numeric" pattern="[0-9]*" class="edit-input"
                            [(ngModel)]="row.weight" (blur)="stopEdit()"
                            (keydown.enter)="stopEdit()" />
                        }
                    </div>
                </td>
            </ng-container>

            <!-- Reps -->
            <ng-container matColumnDef="reps">
                <td mat-cell *matCellDef="let row" cdkDragHandle>
                    <div class="swipe-container">
                        @if (!isEditing(row, 'reps')) {
                        <div class="editable" role="button" tabindex="0" (click)="edit(row, 'reps')" (keydown.enter)="edit(row, 'reps')">
                            {{ row.reps }} reps
                        </div>
                        } @else {
                        <input type="number" inputmode="numeric" pattern="[0-9]*" class="edit-input"
                            [(ngModel)]="row.reps" (blur)="stopEdit()"
                            (keydown.enter)="stopEdit()" />
                        }
                    </div>
                </td>
            </ng-container>

            <!-- Actions -->
            <ng-container matColumnDef="actions">
                <td mat-cell *matCellDef="let row" cdkDragHandle>
                    <button mat-icon-button [matMenuTriggerFor]="rowMenu" (click)="currentRow.set(row)">
                        <mat-icon>more_vert</mat-icon>
                    </button>
                </td>
            </ng-container>

            <mat-menu #rowMenu="matMenu">
                <button mat-menu-item (click)="deleteRow(currentRow())">
                    <mat-icon>delete</mat-icon>
                    Delete
                </button>
            </mat-menu>

            <tr mat-row *matRowDef="let row; columns: displayedColumns" cdkDrag (cdkDragStarted)="onDragStart()">
            </tr>
        </table>

        <!-- Add Set -->
        <div class="center-row">
            <button mat-raised-button color="primary" (click)="addSet()">
                <mat-icon>add</mat-icon>
                Set
            </button>
        </div>

    </mat-card-content>
</mat-card>
