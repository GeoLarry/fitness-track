<div class="dialog-wrapper">
    <!-- HEADER -->
    <div class="dialog-header">
        <button mat-icon-button class="back-btn" (click)="close()">
            <mat-icon>arrow_back</mat-icon>
        </button>

        <h2 class="title">Select Exercise</h2>

        <!-- spacer to keep title centered -->
        <div class="header-spacer"></div>
    </div>

    @if(loading$ | async) {
    <div class="loading">Loading...</div>
    }
    @else {
    <!-- SEARCH FIELD -->
    <mat-form-field appearance="outline" class="search-field">
        <mat-label>Search exercise</mat-label>
        <input matInput (input)="setSearch($any($event.target).value)" placeholder="Type to search..." />
        <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>

    <!-- EXERCISES LIST -->
    <mat-list class="exercise-list">
        @for(exercise of (filteredExercises$ | async) ?? []; track exercise.id) {
        <mat-list-item class="exercise-item">
            <div class="exercise-row">
                <div class="exercise-choice" role="button" tabindex="0" (click)="selectExercise(exercise)" (keydown.enter)="selectExercise(exercise)">
                    <span class="exercise-name">{{ exercise.name }}</span>
                </div>
                <div>
                    <mat-icon class="info-icon" (click)="openInfo(exercise, $event)">help_outline</mat-icon>
                </div>
            </div>
        </mat-list-item>
        }
        @empty {
        <li>There are no exercises stored yet.</li>
        }
    </mat-list>

    <!-- CUSTOM EXERCISE BUTTON -->
    <div class="fixed-footer-button">
        <button mat-raised-button color="primary" class="footer-btn" (click)="createCustomExercise()">
            <mat-icon>add</mat-icon>
            <span>Custom Exercise</span>
        </button>
    </div>

    }

</div>
