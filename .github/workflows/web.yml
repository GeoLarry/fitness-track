name: Web

on:
  push:
    branches: [ main ]
    paths: [ 'web/**', '.github/workflows/web.yml' ]
  pull_request:
    branches: [ main ]
    paths: [ 'web/**', '.github/workflows/web.yml' ]

defaults:
  run:
    working-directory: web

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      # Lint and unit tests join once the app moves to ESLint and Vitest (see the roadmap)
      - name: Build
        run: npm run build
